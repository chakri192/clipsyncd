<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#6b7688"/></marker>
    <marker id="ac" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#5fd0de"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#7ddc8b"/></marker>
  </defs>

  <rect width="880" height="500" rx="10" fill="#0b0d11"/>
  <rect x="0.5" y="0.5" width="879" height="499" rx="10" fill="none" stroke="#2b313d"/>

  <text x="28" y="38" font-size="13" font-weight="700" fill="#8a9bb4" letter-spacing="1.3">SYMMETRIC PEERS · ASYMMETRIC DISCOVERY</text>
  <text x="852" y="38" font-size="11" font-family="SFMono-Regular,Menlo,monospace" fill="#5d6675" text-anchor="end">tcp/59876 · LAN only</text>

  <!-- ── Mac ── -->
  <rect x="28" y="62" width="248" height="186" rx="10" fill="#12151b" stroke="#5fd0de" stroke-width="1.3"/>
  <text x="46" y="86" font-size="12" font-weight="700" fill="#5fd0de">Mac</text>
  <text x="258" y="86" font-size="9.5" font-family="SFMono-Regular,Menlo,monospace" fill="#5d6675" text-anchor="end">launchd</text>
  <line x1="46" y1="96" x2="258" y2="96" stroke="#2b313d"/>
  <g font-size="10" fill="#8a9bb4">
    <text x="46" y="116">watcher — polls every 0.5s</text>
    <text x="46" y="150">server — accepts on :59876</text>
  </g>
  <g font-size="9.5" font-family="SFMono-Regular,Menlo,monospace" fill="#7d8899">
    <text x="60" y="132">launchctl asuser $UID pbpaste</text>
    <text x="60" y="166">launchctl asuser $UID pbcopy</text>
  </g>
  <rect x="46" y="180" width="212" height="50" rx="6" fill="#0f1319" stroke="#39414f"/>
  <text x="58" y="198" font-size="9.5" fill="#f0b866">why launchctl asuser?</text>
  <text x="58" y="213" font-size="9" fill="#7d8899">a launchd daemon has no GUI session —</text>
  <text x="58" y="225" font-size="9" fill="#7d8899">bare pbcopy silently writes nowhere</text>

  <!-- ── Android ── -->
  <rect x="604" y="62" width="248" height="186" rx="10" fill="#12151b" stroke="#7ddc8b" stroke-width="1.3"/>
  <text x="622" y="86" font-size="12" font-weight="700" fill="#7ddc8b">Android</text>
  <text x="834" y="86" font-size="9.5" font-family="SFMono-Regular,Menlo,monospace" fill="#5d6675" text-anchor="end">Termux:Boot</text>
  <line x1="622" y1="96" x2="834" y2="96" stroke="#2b313d"/>
  <g font-size="10" fill="#8a9bb4">
    <text x="622" y="116">watcher — polls every 0.5s</text>
    <text x="622" y="150">server — accepts on :59876</text>
  </g>
  <g font-size="9.5" font-family="SFMono-Regular,Menlo,monospace" fill="#7d8899">
    <text x="636" y="132">termux-clipboard-get</text>
    <text x="636" y="166">termux-clipboard-set</text>
  </g>
  <rect x="622" y="180" width="212" height="50" rx="6" fill="#0f1319" stroke="#39414f"/>
  <text x="634" y="198" font-size="9.5" fill="#f0b866">keepalive every 30s</text>
  <text x="634" y="213" font-size="9" fill="#7d8899">a 0-length frame, sent purely so the</text>
  <text x="634" y="225" font-size="9" fill="#7d8899">Mac re-learns this phone's IP</text>

  <!-- ── the two directions ── -->
  <line x1="282" y1="112" x2="598" y2="112" stroke="#5fd0de" stroke-width="1.5" marker-end="url(#ac)"/>
  <text x="440" y="105" font-size="10" fill="#5fd0de" text-anchor="middle">copy on Mac → push</text>

  <line x1="598" y1="154" x2="282" y2="154" stroke="#7ddc8b" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="440" y="147" font-size="10" fill="#7ddc8b" text-anchor="middle">copy on phone → push</text>

  <text x="440" y="182" font-size="9.5" fill="#5d6675" text-anchor="middle" font-family="SFMono-Regular,Menlo,monospace">one TCP connection per change, then closed</text>

  <!-- ── discovery ── -->
  <text x="28" y="288" font-size="12" font-weight="700" fill="#8a9bb4" letter-spacing="1.1">HOW EACH SIDE FINDS THE OTHER</text>

  <rect x="28" y="300" width="404" height="80" rx="9" fill="#12151b" stroke="#39414f" stroke-width="1.2"/>
  <text x="46" y="322" font-size="10.5" font-weight="700" fill="#5fd0de">phone → Mac : by name</text>
  <text x="46" y="341" font-size="9.5" font-family="SFMono-Regular,Menlo,monospace" fill="#7d8899">socket.gethostbyname("your-mac.local")</text>
  <text x="46" y="360" font-size="9.5" fill="#8a9bb4">mDNS, re-resolved on every failure — so the Mac's</text>
  <text x="46" y="372" font-size="9.5" fill="#8a9bb4">DHCP lease can change and nothing breaks</text>

  <rect x="448" y="300" width="404" height="80" rx="9" fill="#12151b" stroke="#39414f" stroke-width="1.2"/>
  <text x="466" y="322" font-size="10.5" font-weight="700" fill="#7ddc8b">Mac → phone : by observation</text>
  <text x="466" y="341" font-size="9.5" font-family="SFMono-Regular,Menlo,monospace" fill="#7d8899">_android_ip = addr[0]   # from any inbound connect</text>
  <text x="466" y="360" font-size="9.5" fill="#8a9bb4">phones publish no stable mDNS name, so the Mac never</text>
  <text x="466" y="372" font-size="9.5" fill="#8a9bb4">looks one up — it just remembers who last called</text>

  <!-- ── wire format ── -->
  <text x="28" y="416" font-size="12" font-weight="700" fill="#8a9bb4" letter-spacing="1.1">ON THE WIRE</text>

  <rect x="28" y="428" width="76" height="34" rx="5" fill="#182029" stroke="#5fd0de" stroke-width="1.2"/>
  <text x="66" y="443" font-size="9.5" font-weight="700" fill="#5fd0de" text-anchor="middle">length</text>
  <text x="66" y="456" font-size="9" fill="#7d8899" text-anchor="middle">4 bytes</text>

  <rect x="110" y="428" width="122" height="34" rx="5" fill="#182029" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="171" y="443" font-size="9.5" font-weight="700" fill="#a78bfa" text-anchor="middle">HMAC-SHA256</text>
  <text x="171" y="456" font-size="9" fill="#7d8899" text-anchor="middle">32 bytes, optional</text>

  <rect x="238" y="428" width="214" height="34" rx="5" fill="#182029" stroke="#39414f" stroke-width="1.2"/>
  <text x="345" y="443" font-size="9.5" font-weight="700" fill="#e6edf3" text-anchor="middle">clipboard payload, UTF-8</text>
  <text x="345" y="456" font-size="9" fill="#7d8899" text-anchor="middle">over 10 MB is refused unread</text>

  <rect x="470" y="428" width="382" height="34" rx="5" fill="#0f1319" stroke="#4a3138" stroke-width="1.2"/>
  <text x="484" y="443" font-size="9.5" font-weight="700" fill="#f2707c">echo guard</text>
  <text x="484" y="456" font-size="9" fill="#8a9bb4">a change within 1.5s of a remote write is not pushed back — the loop stops here</text>

  <line x1="28" y1="478" x2="852" y2="478" stroke="#2b313d"/>
  <text x="440" y="492" font-size="9.5" fill="#5d6675" text-anchor="middle" font-family="SFMono-Regular,Menlo,monospace">no cloud · no account · no third-party server — the two devices only ever talk to each other</text>
</svg>
