<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <rect width="720" height="260" fill="#ffffff"/>

  <rect x="30" y="70" width="200" height="120" rx="12" fill="#1c1c1e"/>
  <text x="130" y="115" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="600">Mac</text>
  <text x="130" y="140" text-anchor="middle" fill="#c7c7c7" font-size="12">clipsyncd_mac.py</text>
  <text x="130" y="158" text-anchor="middle" fill="#c7c7c7" font-size="12">launchd · pbcopy/pbpaste</text>

  <rect x="490" y="70" width="200" height="120" rx="12" fill="#1c1c1e"/>
  <text x="590" y="115" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="600">Android</text>
  <text x="590" y="140" text-anchor="middle" fill="#c7c7c7" font-size="12">clipsyncd app</text>
  <text x="590" y="158" text-anchor="middle" fill="#c7c7c7" font-size="12">SyncService · Shizuku</text>

  <line x1="230" y1="105" x2="490" y2="105" stroke="#3DDC84" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <line x1="490" y1="150" x2="230" y2="150" stroke="#3DDC84" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="360" y="90" text-anchor="middle" fill="#3DDC84" font-size="12" font-weight="600">clipboard changed</text>
  <text x="360" y="172" text-anchor="middle" fill="#3DDC84" font-size="12" font-weight="600">clipboard changed</text>

  <text x="360" y="205" text-anchor="middle" fill="#5a5a5a" font-size="12">TCP :59876 · length-prefixed frame · optional HMAC-SHA256</text>
  <text x="360" y="225" text-anchor="middle" fill="#5a5a5a" font-size="12">Mac discovered via mDNS (dns-sd advertise / NsdManager browse) — no cloud, no relay</text>

  <defs>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3DDC84"/>
    </marker>
  </defs>
</svg>
