<svg xmlns="http://www.w3.org/2000/svg" width="880" height="280" viewBox="0 0 880 280">
  <defs>
    <radialGradient id="pool"><stop offset="0%" stop-color="#7fe3ff" stop-opacity="0.85"/><stop offset="45%" stop-color="#2f8fc4" stop-opacity="0.30"/><stop offset="100%" stop-color="#0a1620" stop-opacity="0"/></radialGradient>
    <radialGradient id="pool2"><stop offset="0%" stop-color="#9dffc4" stop-opacity="0.85"/><stop offset="45%" stop-color="#2fa86a" stop-opacity="0.28"/><stop offset="100%" stop-color="#0a1620" stop-opacity="0"/></radialGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7fe3ff" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#eaf7ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#9dffc4" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="dot"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#8fd8ff" stop-opacity="0"/></radialGradient>
    <filter id="b1"><feGaussianBlur stdDeviation="7"/></filter>
    <clipPath id="f"><rect width="880" height="280" rx="10"/></clipPath>
  </defs>

  <g clip-path="url(#f)">
    <rect width="880" height="280" fill="#080b10"/>
    <ellipse cx="180" cy="190" rx="230" ry="120" fill="url(#pool)"/>
    <ellipse cx="700" cy="190" rx="230" ry="120" fill="url(#pool2)"/>

    <!-- the two surfaces -->
    <ellipse cx="180" cy="196" rx="96" ry="20" fill="#0d1a24"/>
    <ellipse cx="180" cy="194" rx="96" ry="20" fill="none" stroke="#5fd0de" stroke-opacity="0.5"/>
    <ellipse cx="700" cy="196" rx="96" ry="20" fill="#0d2119"/>
    <ellipse cx="700" cy="194" rx="96" ry="20" fill="none" stroke="#7ddc8b" stroke-opacity="0.5"/>

    <!-- ripples leaving one, arriving at the other -->
    <g fill="none" stroke="#5fd0de" stroke-opacity="0.22">
      <ellipse cx="180" cy="194" rx="122" ry="26"/><ellipse cx="180" cy="194" rx="150" ry="32"/><ellipse cx="180" cy="194" rx="180" ry="38"/>
    </g>
    <g fill="none" stroke="#7ddc8b" stroke-opacity="0.22">
      <ellipse cx="700" cy="194" rx="122" ry="26"/><ellipse cx="700" cy="194" rx="150" ry="32"/><ellipse cx="700" cy="194" rx="180" ry="38"/>
    </g>

    <!-- the arc, brightest where it crosses -->
    <path d="M180 178 C 300 44, 560 44, 700 178" stroke="url(#arc)" stroke-width="2.4" fill="none" filter="url(#b1)" opacity="0.9"/>
    <path d="M180 178 C 300 44, 560 44, 700 178" stroke="url(#arc)" stroke-width="1.3" fill="none"/>

    <!-- packets in flight -->
    <circle cx="352" cy="80" r="9" fill="url(#dot)"/>
    <circle cx="440" cy="66" r="12" fill="url(#dot)"/>
    <circle cx="536" cy="80" r="8" fill="url(#dot)"/>
    <circle cx="440" cy="66" r="2.6" fill="#ffffff"/>
    <circle cx="352" cy="80" r="1.9" fill="#dff4ff"/>
    <circle cx="536" cy="80" r="1.9" fill="#e0ffe9"/>

    <!-- the two endpoints -->
    <circle cx="180" cy="178" r="16" fill="url(#dot)" opacity="0.8"/>
    <circle cx="180" cy="178" r="3.4" fill="#dff4ff"/>
    <circle cx="700" cy="178" r="16" fill="url(#dot)" opacity="0.8"/>
    <circle cx="700" cy="178" r="3.4" fill="#e0ffe9"/>
  </g>
  <rect x="0.5" y="0.5" width="879" height="279" rx="10" fill="none" stroke="#22242b"/>
</svg>
